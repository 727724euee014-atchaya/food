<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Delivery App</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">



</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">

<div class="container">

<a class="navbar-brand" href="#">🍔 Food Delivery</a>

</div>

</nav>

<!-- Hero -->

<div class="hero">

<h1>Welcome to Food Delivery</h1>

<p>Fresh & Delicious Food Delivered to Your Doorstep</p>

</div>

<!-- Search -->

<div class="container mt-4">

<div class="row">

<div class="col-md-8">

<input
type="text"
id="search"
class="form-control"
placeholder="Search Food">

</div>

<div class="col-md-4">

<button
class="btn btn-primary w-100"
onclick="searchFood()">

Search

</button>

</div>

</div>

</div>

<!-- Food Items -->

<div class="container mt-5">

<div class="row">

<!-- Pizza -->

<div class="col-md-4 food-card" id="pizza">

<div class="card">

<img src="https://via.placeholder.com/300x200?text=Pizza"
class="card-img-top">

<div class="card-body text-center">

<h4>Pizza</h4>

<p>₹299</p>

<button
class="btn btn-danger"
onclick="addToCart('Pizza - ₹299')">

Add to Cart

</button>

</div>

</div>

</div>

<!-- Burger -->

<div class="col-md-4 food-card" id="burger">

<div class="card">

<img src="https://via.placeholder.com/300x200?text=Burger"
class="card-img-top">

<div class="card-body text-center">

<h4>Burger</h4>

<p>₹199</p>

<button
class="btn btn-danger"
onclick="addToCart('Burger - ₹199')">

Add to Cart

</button>

</div>

</div>

</div>

<!-- Pasta -->

<div class="col-md-4 food-card" id="pasta">

<div class="card">

<img src="https://via.placeholder.com/300x200?text=Pasta"
class="card-img-top">

<div class="card-body text-center">

<h4>Pasta</h4>

<p>₹249</p>

<button
class="btn btn-danger"
onclick="addToCart('Pasta - ₹249')">

Add to Cart

</button>

</div>

</div>

</div>

</div>

</div>

<!-- Cart -->

<div class="container mt-5">

<h2>🛒 Shopping Cart</h2>

<ul
id="cart"
class="list-group">

</ul>

</div>

<!-- Footer -->

<footer>

<p>© 2026 Food Delivery App</p>

</footer>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

// Add to Cart

function addToCart(item){

let cart=document.getElementById("cart");

let li=document.createElement("li");

li.className="list-group-item";

li.innerHTML=item;

cart.appendChild(li);

}

// Search

function searchFood(){

let value=document.getElementById("search").value.toLowerCase();

let cards=document.getElementsByClassName("food-card");

for(let i=0;i<cards.length;i++){

let name=cards[i].id;

if(name.includes(value) || value==""){

cards[i].style.display="block";

}
else{

cards[i].style.display="none";

}

}

}

</script>

</body>
</html>
